name: Build RobloxMod (Android)

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Cache Luau clone
        uses: actions/cache@v4
        with:
          path: android/third_party/luau
          key: android-luau-0.640

      - name: Build .so (arm64-v8a + armeabi-v7a)
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          chmod +x android/build.sh
          android/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobloxMod-android
          path: android/out/
          if-no-files-found: error
